<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilt angle of plane calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700">
        <!-- Title at the very top -->
        <h1 class="text-xl font-bold mb-2 text-center text-sky-400">Tilt angle of plane calculator</h1>
        
        <!-- Explanatory text under upper text and over pictures -->
        <p class="text-xs text-slate-400 text-center mb-6 leading-relaxed">
            The tilt angle of a plane so that the pilot and passengers will be pushed down into their seats when turning
        </p>

        <!-- Two Side-by-Side Illustrations -->
        <div class="mb-6 flex justify-center items-center gap-4">
            <!-- Sketch 1: Tilt Angle (Matched exactly to your reference image) -->
            <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700 flex flex-col items-center">
                <svg class="w-36 h-24 text-sky-400" viewBox="0 0 160 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Horizontal line extending to the left -->
                    <line x1="20" y1="52" x2="85" y2="52" stroke="#ffffff" stroke-width="1.5" />
                    <!-- Banking Plane (Left wing tilted down) -->
                    <g transform="translate(85, 52) rotate(-22)">
                        <!-- Fuselage center / nose -->
                        <circle cx="0" cy="0" r="8" fill="#38bdf8" />
                        <!-- Vertical tail fin pointing up -->
                        <polygon points="0,-8 -3,-28 3,-28" fill="#0284c7" />
                        <!-- Wings -->
                        <rect x="-50" y="-3.5" width="100" height="7" rx="2.5" fill="#0ea5e9" />
                        <!-- Cockpit detail -->
                        <circle cx="0" cy="-2" r="3" fill="#bae6fd" />
                    </g>
                    <!-- Angle Arc θ and symbol positioned between horizontal line and lower wing -->
                    <path d="M 62 52 A 20 20 0 0 1 68 70" stroke="#f43f5e" stroke-width="1.5" fill="none" />
                    <text x="47" y="63" fill="#f43f5e" font-size="11" font-weight="bold">θ</text>
                </svg>
            </div>

            <!-- Sketch 2: Turn Radius & Speed (Top-down view) -->
            <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700 flex flex-col items-center">
                <svg class="w-36 h-24 text-sky-400" viewBox="0 0 160 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Plane Facing Up -->
                    <g transform="translate(60, 75)">
                        <rect x="-4" y="-18" width="8" height="28" rx="3" fill="#38bdf8" />
                        <rect x="-22" y="-8" width="44" height="6" rx="2" fill="#0ea5e9" />
                        <polygon points="0,-24 6,-16 -6,-16" fill="#0284c7" />
                        <!-- Velocity Vector v -->
                        <line x1="0" y1="-24" x2="0" y2="-40" stroke="#f43f5e" stroke-width="1.5" />
                        <polygon points="0,-44 -3,-38 3,-38" fill="#f43f5e" />
                        <text x="-12" y="-33" fill="#f43f5e" font-size="10" font-weight="bold">v</text>
                    </g>
                    <!-- Turn Arc & Radius R -->
                    <path d="M 60 51 C 60 20, 90 10, 150 10" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
                    <line x1="60" y1="51" x2="140" y2="51" stroke="#64748b" stroke-width="1.5" />
                    <text x="95" y="45" fill="#38bdf8" font-size="10" font-weight="bold">R</text>
                </svg>
            </div>
        </div>

        <!-- Error Message Box -->
        <div id="error-msg" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500 text-red-200 text-sm rounded-lg text-center">
            Insert at least two of the parameters
        </div>

        <!-- 1. Tilt Angle Input -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2 text-slate-300">Tilt Angle (degrees)</label>
            <input type="number" id="angle" placeholder="Enter angle" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-sky-500">
        </div>

        <!-- 2. Speed Input -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2 text-slate-300">Speed (m/s)</label>
            <input type="number" id="speed" placeholder="Enter speed" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-sky-500">
        </div>

        <!-- 3. Turn Radius Input -->
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2 text-slate-300">Turn Radius (meters)</label>
            <input type="number" id="radius" placeholder="Enter radius" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-sky-500">
        </div>

        <!-- Buttons Container -->
        <div class="flex gap-3">
            <!-- Calculate Button -->
            <button onclick="calculate()" class="w-2/3 bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg">
                Calculate
            </button>
            <!-- Reset Button -->
            <button onclick="resetCalculator()" class="w-1/3 bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg border border-slate-600">
                Reset
            </button>
        </div>
    </div>

    <script>
        const g = 9.81;

        function calculate() {
            const angleInput = document.getElementById('angle');
            const speedInput = document.getElementById('speed');
            const radiusInput = document.getElementById('radius');
            const errorBox = document.getElementById('error-msg');

            const hasAngle = angleInput.value !== '' && !isNaN(parseFloat(angleInput.value));
            const hasSpeed = speedInput.value !== '' && !isNaN(parseFloat(speedInput.value));
            const hasRadius = radiusInput.value !== '' && !isNaN(parseFloat(radiusInput.value));

            let count = (hasAngle ? 1 : 0) + (hasSpeed ? 1 : 0) + (hasRadius ? 1 : 0);

            if (count < 2) {
                errorBox.classList.remove('hidden');
                return;
            } else {
                errorBox.classList.add('hidden');
            }

            if (!hasAngle && hasSpeed && hasRadius) {
                const V = parseFloat(speedInput.value);
                const R = parseFloat(radiusInput.value);
                if (g * R !== 0) {
                    const angleRad = Math.atan((V * V) / (g * R));
                    angleInput.value = (angleRad * (180 / Math.PI)).toFixed(2);
                }
            } else if (!hasSpeed && hasAngle && hasRadius) {
                const angleDeg = parseFloat(angleInput.value);
                const R = parseFloat(radiusInput.value);
                const angleRad = angleDeg * (Math.PI / 180);
                const V = Math.sqrt(g * R * Math.tan(angleRad));
                speedInput.value = V.toFixed(2);
            } else if (!hasRadius && hasAngle && hasSpeed) {
                const angleDeg = parseFloat(angleInput.value);
                const V = parseFloat(speedInput.value);
                const angleRad = angleDeg * (Math.PI / 180);
                const tanVal = Math.tan(angleRad);
                if (tanVal !== 0) {
                    const R = (V * V) / (g * tanVal);
                    radiusInput.value = R.toFixed(2);
                }
            } else {
                const V = parseFloat(speedInput.value);
                const R = parseFloat(radiusInput.value);
                const angleRad = Math.atan((V * V) / (g * R));
                angleInput.value = (angleRad * (180 / Math.PI)).toFixed(2);
            }
        }

        function resetCalculator() {
            document.getElementById('angle').value = '';
            document.getElementById('speed').value = '';
            document.getElementById('radius').value = '';
            document.getElementById('error-msg').classList.add('hidden');
        }
    </script>
</body>
</html>
